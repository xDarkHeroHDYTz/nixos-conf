name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Configure Nix
        run: |
          echo "experimental-features = nix-command flakes" | sudo tee -a /etc/nix/nix.conf
          echo "accept-flake-config = true" | sudo tee -a /etc/nix/nix.conf

      - name: Flake check
        run: nix flake check

      - name: Format check (nixfmt-tree)
        run: nix run nixpkgs#nixfmt-tree .

      - name: Statix check
        run: nix run nixpkgs#statix -- check .

      - name: Deadnix check
        run: nix run nixpkgs#deadnix -- .
